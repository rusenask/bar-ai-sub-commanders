# LLM strategist bridge for the BAR Sub-Commanders widget.
#   make up / make down / make logs
services:
  scbridge:
    build: .
    image: bar-scbridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:7878:7878" # game widget (Sub-Commanders AI link)
      - "127.0.0.1:4517:4517" # opencode server: `opencode attach http://127.0.0.1:4517`
    environment:
      SCBRIDGE_MODEL: ${MODEL:-node06/glm-5.3-flash}
      # optional decision model for the widget's fast choices (Kev / Clef on a GPU host), e.g. http://100.108.100.25:8009
      SCBRIDGE_DECIDER_URL: ${DECIDER_URL:-}
      SCBRIDGE_DECIDER_MODEL: ${DECIDER_MODEL:-kev-latest}
      # our own per-task models (design/decision-models.md), e.g. fight=http://host:8011,unit=http://host:8012,turret=http://host:8013
      SCBRIDGE_DECIDER_ROUTES: ${DECIDER_ROUTES:-}
      # newer BAR (game version test-31614+) takes sockets away from widgets: the widget then links through
      # files in LuaUI/Config/scbridge, mounted here (internal/game/files.go)
      SCBRIDGE_GAME_FILES: /bar-files
    secrets:
      - llm_api_key
    volumes:
      # edit the agent/prompt without rebuilding: make restart
      - ./strategist:/app/strategist:ro
      - ${BAR_FILES:-${HOME}/Library/Application Support/Beyond-All-Reason-mac/LuaUI/Config/scbridge}:/bar-files
      # learned doctrine per matchup (internal/learn): sent to each game; real results are recorded in it
      - ./learn:/app/learn
      - ./widget/LuaUI/Include:/app/widget/LuaUI/Include:ro
      # opencode sessions and provider package cache survive restarts
      - opencode-data:/root/.local/share/opencode
      - opencode-cache:/root/.cache/opencode

  # the bridge for the bot opponent's sub-commanders (play/vs.sh, make play-vs): a second game connection
  # would replace yours on 7878, so the bot gets its own
  scbridge-bot:
    image: bar-scbridge
    depends_on: [scbridge]
    restart: unless-stopped
    ports:
      - "127.0.0.1:7879:7878"
      - "127.0.0.1:4518:4517"
    environment:
      SCBRIDGE_MODEL: ${MODEL:-node06/glm-5.3-flash}
    secrets:
      - llm_api_key
    volumes:
      - ./strategist:/app/strategist:ro
      - opencode-bot-data:/root/.local/share/opencode
      - opencode-cache:/root/.cache/opencode

secrets:
  # file holding the API key for the provider in docker/opencode.json (set the path in .env)
  llm_api_key:
    file: ${LLM_API_KEY_FILE:-./secrets/llm_api_key}

volumes:
  opencode-data:
  opencode-bot-data:
  opencode-cache:
